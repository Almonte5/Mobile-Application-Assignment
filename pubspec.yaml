name: mq_marketplace
description: "Buy, sell, and swap with the Macquarie University community."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  provider: ^6.1.2

  # Device services
  image_picker: ^1.1.2
  geolocator: ^13.0.1

  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^0.3.0
  fake_cloud_firestore: ^3.0.3

flutter:
  uses-material-design: true